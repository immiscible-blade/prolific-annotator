name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e ".[dev]"
      - name: Unit, parity and backend tests
        run: pytest -q --ignore=tests/e2e
      - name: Example studies validate and build
        run: |
          pannot init /tmp/tree && pannot validate /tmp/tree/study.yaml && pannot build /tmp/tree/study.yaml --out /tmp/tree/build
          pannot init /tmp/survey --example survey && pannot build /tmp/survey/study.yaml --out /tmp/survey/build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" playwright
      - run: python -m playwright install --with-deps chromium
      - name: End-to-end browser tests
        env:
          REQUIRE_BROWSER: "1"
        run: pytest -q -rs tests/e2e
