name: Demo site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Build the example study as a backend-free demo
        run: |
          pannot init /tmp/demo
          pannot build /tmp/demo/study.yaml --out /tmp/demo/build --demo
          mkdir -p _site/survey
          cp -r /tmp/demo/build/site/. _site/
          pannot init /tmp/survey --example survey
          pannot build /tmp/survey/study.yaml --out /tmp/survey/build --demo
          cp -r /tmp/survey/build/site/. _site/survey/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
